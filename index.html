<!DOCTYPE html>
<html lang="de">
<head>
<meta name="google-site-verification" content="wNpx3jP2STJUrjiRRMEym3zoro4GbTuaNAh2rYNbQR8" />  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nahelt11 Game</title>
<style>
  :root{
    --ink:#1b1f3b;
    --ink-2:#262b4d;
    --paper:#f2ede3;
    --copper:#c8793c;
    --copper-2:#e39a5f;
    --mist:#7c86b8;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(circle at 30% 0%, #262b4d, #14172c 70%);
    color:var(--paper);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 32px;
    min-height:100%;
    overflow-x:hidden;
  }
  h1{
    font-size:2.1rem;
    letter-spacing:0.04em;
    margin:4px 0 2px;
    font-weight:400;
    font-style:italic;
    color:var(--paper);
  }
  p.tag{
    margin:0 0 18px;
    color:var(--mist);
    font-size:0.9rem;
    letter-spacing:0.03em;
  }
  .scores{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .score-box{
    background:var(--ink-2);
    border-radius:10px;
    padding:8px 18px;
    text-align:center;
    min-width:78px;
    border:1px solid #383e6b;
  }
  .score-box .label{
    font-size:0.62rem;
    color:var(--mist);
    letter-spacing:0.08em;
  }
  .score-box .value{
    font-size:1.25rem;
    font-variant-numeric:tabular-nums;
  }
  #board-wrap{
    position:relative;
    width:min(92vw,420px);
    aspect-ratio:1/1;
    touch-action:none;
  }
  #board{
    position:absolute;
    inset:0;
    background:var(--ink-2);
    border-radius:16px;
    padding:10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:10px;
  }
  .cell-bg{
    background:rgba(255,255,255,0.04);
    border-radius:10px;
  }
  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    font-size:1.6rem;
    font-weight:600;
    color:var(--ink);
    background:var(--paper);
    transition:transform 120ms ease, background 120ms ease;
  }
  .tile.new{ animation:pop 160ms ease; }
  .tile.merged{ animation:pulse 160ms ease; }
  @keyframes pop{ from{transform:scale(0.5);} to{transform:scale(1);} }
  @keyframes pulse{ 0%{transform:scale(1);} 45%{transform:scale(1.14);} 100%{transform:scale(1);} }

  .msg-overlay{
    position:absolute;
    inset:0;
    background:rgba(20,23,44,0.88);
    border-radius:16px;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:20px;
  }
  .msg-overlay.show{ display:flex; }
  .msg-overlay h2{ margin:0; font-style:italic; font-weight:400; font-size:1.5rem; }
  .msg-overlay button, #restart{
    background:var(--copper);
    color:var(--paper);
    border:none;
    padding:10px 22px;
    border-radius:999px;
    font-size:0.95rem;
    letter-spacing:0.03em;
    cursor:pointer;
    font-family:inherit;
  }
  .msg-overlay button:active, #restart:active{ background:var(--copper-2); }
  #controls{ margin-top:22px; }
  #hint{
    margin-top:14px;
    color:var(--mist);
    font-size:0.78rem;
    text-align:center;
  }

  #game-view{
    display:none;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  #game-view.show{ display:flex; }

  #start-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:80vh;
    width:100%;
    max-width:420px;
    position:relative;
  }
  #start-screen.hidden{ display:none; }
  .brand-glyph{
    width:78px;
    height:78px;
    border-radius:50%;
    background:linear-gradient(145deg,var(--copper),var(--copper-2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    font-weight:700;
    color:var(--ink);
    margin-bottom:18px;
    box-shadow:0 0 0 6px rgba(200,121,60,0.18);
  }
  #start-screen h1{
    font-size:2.4rem;
    margin:0 0 4px;
  }
  #start-screen .arabic-title{
    font-family:'Tahoma','Segoe UI',sans-serif;
    font-size:1.3rem;
    color:var(--copper-2);
    margin:0 0 6px;
    letter-spacing:0;
  }
  #start-screen p.tag{ margin-bottom:34px; }
  #play-btn{
    background:var(--copper);
    color:var(--ink);
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:0.04em;
    padding:16px 56px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(200,121,60,0.35);
    transition:transform 100ms ease;
  }
  #play-btn:active{ transform:scale(0.96); background:var(--copper-2); }
  .sound-toggle{
    margin-top:26px;
    background:none;
    border:1px solid #383e6b;
    color:var(--mist);
    padding:8px 16px;
    border-radius:999px;
    font-family:inherit;
    font-size:0.8rem;
    cursor:pointer;
  }
  .sound-toggle.on{ color:var(--copper-2); border-color:var(--copper); }
</style>
</head>
<body>

  <div id="start-screen">
    <div class="brand-glyph">N11</div>
    <h1>Nahelt11 Game</h1>
    <p class="tag">Wische, verschmelze, erreiche 2048.</p>
    <button id="play-btn">▶ Play</button>
    <button class="sound-toggle on" id="sound-toggle">🔊 Sound an</button>
  </div>

  <div id="game-view">
    <h1>Nahelt11 Game</h1>
    <p class="tag">Wische, verschmelze, erreiche 2048.</p>

    <div class="scores">
      <div class="score-box"><div class="label">PUNKTE</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">BESTWERT</div><div class="value" id="best">0</div></div>
    </div>

    <div id="board-wrap">
      <div id="board"></div>
      <div class="msg-overlay" id="overlay">
        <h2 id="overlay-text">Geschafft!</h2>
        <button id="overlay-btn">Neues Spiel</button>
      </div>
    </div>

    <div id="controls">
      <button id="restart">Neu starten</button>
    </div>
    <p id="hint">Pfeiltasten oder Wischen zum Spielen</p>
  </div>

<script>
(function(){
  const SIZE = 4;
  let grid, score, best, won, over;
  let soundOn = true;
  let audioCtx = null;

  function getCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ return null; }
    }
    return audioCtx;
  }

  function beep(freq, duration, type, gainVal){
    if(!soundOn) return;
    const ctx = getCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = gainVal || 0.08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.start(now);
    osc.stop(now + duration);
  }

  const sfx = {
    move: ()=> beep(220, 0.08, 'triangle', 0.05),
    merge: ()=> beep(440, 0.14, 'sine', 0.09),
    win: ()=>{ beep(523,0.15,'sine',0.1); setTimeout(()=>beep(659,0.15,'sine',0.1),120); setTimeout(()=>beep(784,0.25,'sine',0.1),240); },
    lose: ()=>{ beep(300,0.2,'sawtooth',0.06); setTimeout(()=>beep(180,0.3,'sawtooth',0.06),150); },
    click: ()=> beep(600,0.06,'square',0.05)
  };
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlay-text');

  const tileColors = {
    2:'#f2ede3',4:'#eddcc0',8:'#e6b877',16:'#e39a5f',32:'#dd7f4a',
    64:'#c8793c',128:'#a8629f',256:'#7c86b8',512:'#5a68a3',
    1024:'#3d4a8c',2048:'#c8793c'
  };

  function loadBest(){
    try{
      const raw = localStorage.getItem('ripple-best');
      return raw ? parseInt(raw,10) : 0;
    }catch(e){ return 0; }
  }
  function saveBest(v){
    try{ localStorage.setItem('ripple-best', String(v)); }catch(e){}
  }

  function emptyGrid(){
    return Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  }

  function newGame(){
    grid = emptyGrid();
    score = 0; won = false; over = false;
    addRandomTile(); addRandomTile();
    best = loadBest();
    overlay.classList.remove('show');
    render(true);
  }

  function addRandomTile(){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]===0) empties.push([r,c]);
    if(empties.length===0) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render(fresh){
    boardEl.innerHTML = '';
    // background cells
    for(let i=0;i<SIZE*SIZE;i++){
      const bg = document.createElement('div');
      bg.className='cell-bg';
      boardEl.appendChild(bg);
    }
    const rect = boardEl.getBoundingClientRect();
    const gap = 10;
    const cellSize = (rect.width - gap*(SIZE+1)) / SIZE;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const val = grid[r][c];
        if(val===0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile' + (fresh ? '' : '');
        tile.textContent = val;
        tile.style.width = cellSize+'px';
        tile.style.height = cellSize+'px';
        tile.style.left = (gap + c*(cellSize+gap))+'px';
        tile.style.top = (gap + r*(cellSize+gap))+'px';
        tile.style.background = tileColors[val] || '#c8793c';
        tile.style.color = val <= 4 ? '#1b1f3b' : '#f2ede3';
        tile.style.fontSize = (val > 512 ? cellSize*0.32 : cellSize*0.4)+'px';
        boardEl.appendChild(tile);
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function slideRowLeft(row){
    const vals = row.filter(v=>v!==0);
    const result = [];
    let gained = 0;
    for(let i=0;i<vals.length;i++){
      if(vals[i] === vals[i+1]){
        const merged = vals[i]*2;
        result.push(merged);
        gained += merged;
        if(merged === 2048) won = true;
        i++;
      } else {
        result.push(vals[i]);
      }
    }
    while(result.length < SIZE) result.push(0);
    return {row:result, gained};
  }

  function rotateGridCW(g){
    const n = g.length;
    const res = emptyGrid();
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) res[c][n-1-r] = g[r][c];
    return res;
  }

  function move(dir){
    // dir: 'left','right','up','down'
    let g = grid.map(row=>row.slice());
    let rotations = 0;
    if(dir==='up') rotations = 3;
    else if(dir==='right') rotations = 2;
    else if(dir==='down') rotations = 1;
    for(let i=0;i<rotations;i++) g = rotateGridCW(g);

    let moved = false;
    let totalGain = 0;
    const newG = [];
    for(let r=0;r<SIZE;r++){
      const {row, gained} = slideRowLeft(g[r]);
      if(row.join(',') !== g[r].join(',')) moved = true;
      totalGain += gained;
      newG.push(row);
    }
    let finalG = newG;
    const back = (4 - rotations) % 4;
    for(let i=0;i<back;i++) finalG = rotateGridCW(finalG);

    if(moved){
      grid = finalG;
      score += totalGain;
      if(score > best){ best = score; saveBest(best); }
      if(totalGain > 0) sfx.merge(); else sfx.move();
      addRandomTile();
      render(false);
      checkEnd();
    }
  }

  function canMove(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0) return true;
        if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return true;
        if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return true;
      }
    }
    return false;
  }

  function checkEnd(){
    if(won && !over){
      over = true;
      overlayText.textContent = 'Geschafft! 2048 erreicht.';
      overlay.classList.add('show');
      sfx.win();
    } else if(!canMove()){
      over = true;
      overlayText.textContent = 'Keine Züge mehr.';
      overlay.classList.add('show');
      sfx.lose();
    }
  }

  // input: keyboard
  window.addEventListener('keydown', (e)=>{
    if(over) return;
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // input: touch swipe
  let touchStartX=0, touchStartY=0;
  const wrap = document.getElementById('board-wrap');
  wrap.addEventListener('touchstart', (e)=>{
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});
  wrap.addEventListener('touchend', (e)=>{
    if(over) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, {passive:true});

  document.getElementById('restart').addEventListener('click', ()=>{ sfx.click(); newGame(); });
  document.getElementById('overlay-btn').addEventListener('click', ()=>{ sfx.click(); newGame(); });
  window.addEventListener('resize', ()=>render(false));

  const startScreen = document.getElementById('start-screen');
  const gameView = document.getElementById('game-view');
  const playBtn = document.getElementById('play-btn');
  const soundToggle = document.getElementById('sound-toggle');

  soundToggle.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊 Sound an' : '🔇 Sound aus';
    soundToggle.classList.toggle('on', soundOn);
    if(soundOn) beep(500,0.05,'square',0.05);
  });

  playBtn.addEventListener('click', ()=>{
    getCtx();
    sfx.click();
    startScreen.classList.add('hidden');
    gameView.classList.add('show');
    newGame();
  });
})();
</script>
</body>
</html>
